<!DOCTYPE html>
<html lang="en" x-data="dashboard()" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardened Containers Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="h-8 w-8 text-green-600" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 008 20C19 20 22 3 22 3c-1 2-8 3.25-11 5z"/>
        </svg>
        <div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white">Hardened Containers Dashboard</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">gardenlinux org · container-* repos</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-sm text-gray-500 dark:text-gray-400 hidden sm:block">
          <span x-show="!loading && !error" style="display:none">
            Updated: <span class="font-medium" x-text="formattedTimestamp"></span>
          </span>
          <span x-show="loading">Loading...</span>
          <span x-show="error && !loading" class="text-red-500" x-text="error"></span>
        </div>

        <button
          @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
          :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <svg x-show="darkMode" style="display:none" class="h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
          <svg x-show="!darkMode" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <div class="mb-4 flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
      <div class="relative w-full sm:w-80">
        <input
          type="search"
          x-model="search"
          placeholder="Filter repos..."
          class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-green-500
                 placeholder-gray-400 dark:placeholder-gray-500"
        />
        <svg class="absolute left-2.5 top-2.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"/>
        </svg>
      </div>

      <div class="flex gap-2 text-xs flex-wrap" x-show="!loading && !error" style="display:none">
        <span class="px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
          <span x-text="repos.length"></span> repos
        </span>
        <span class="px-2 py-1 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400">
          <span x-text="pendingCount"></span> pending update<span x-show="pendingCount !== 1">s</span>
        </span>
        <span x-show="failCount > 0" style="display:none" class="px-2 py-1 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400">
          <span x-text="failCount"></span> failing CI
        </span>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700">
              <th class="text-left px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">Repository</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">GL base image</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">Current Version</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">Released</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">Check upstream CI status</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-700 dark:text-gray-300">Pending Update</th>
            </tr>
          </thead>
          <tbody>

            <template x-if="loading">
              <template x-for="i in 8" :key="i">
                <tr class="border-b border-gray-100 dark:border-gray-700/50">
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-40"></div></td>
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-20"></div></td>
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-24"></div></td>
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-20"></div></td>
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-16 mx-auto"></div></td>
                  <td class="px-4 py-3"><div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-24"></div></td>
                </tr>
              </template>
            </template>

            <template x-if="error && !loading">
              <tr>
                <td colspan="6" class="px-4 py-12 text-center text-red-500 dark:text-red-400">
                  <svg class="h-8 w-8 mx-auto mb-2 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                  </svg>
                  <p class="font-medium" x-text="error"></p>
                  <button @click="fetchData()" class="mt-3 text-sm underline hover:no-underline">Retry</button>
                </td>
              </tr>
            </template>

            <template x-if="!loading && !error">
              <template x-for="repo in filteredRepos" :key="repo.name">
                <tr class="border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">

                  <td class="px-4 py-3">
                    <a :href="repo.url" target="_blank" rel="noopener"
                       class="font-medium text-green-700 dark:text-green-400 hover:underline inline-flex items-center gap-1">
                      <span x-text="repo.name.replace('container-', '')"></span>
                      <svg class="h-3 w-3 opacity-50 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                      </svg>
                    </a>
                  </td>

                  <td class="px-4 py-3">
                    <template x-if="repo.base_image_tag">
                      <span class="font-mono text-xs bg-green-50 dark:bg-green-900/20 text-green-800 dark:text-green-300 px-2 py-1 rounded"
                            x-text="repo.base_image_tag">
                      </span>
                    </template>
                    <template x-if="!repo.base_image_tag">
                      <span class="text-gray-300 dark:text-gray-600">—</span>
                    </template>
                  </td>

                  <td class="px-4 py-3">
                    <template x-if="repo.latest_release">
                      <a :href="repo.latest_release.url" target="_blank" rel="noopener"
                         class="font-mono text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded
                                hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                         x-text="repo.latest_release.version">
                      </a>
                    </template>
                    <template x-if="!repo.latest_release">
                      <span class="text-gray-400 dark:text-gray-500 text-xs italic">no release</span>
                    </template>
                  </td>

                  <td class="px-4 py-3 text-xs text-gray-500 dark:text-gray-400">
                    <template x-if="repo.latest_release">
                      <span x-text="relativeTime(repo.latest_release.published_at)"
                            :title="repo.latest_release.published_at"></span>
                    </template>
                    <template x-if="!repo.latest_release">
                      <span class="text-gray-300 dark:text-gray-600">—</span>
                    </template>
                  </td>

                  <td class="px-4 py-3 text-center">
                    <template x-if="!repo.check_upstream">
                      <span class="text-gray-300 dark:text-gray-600 text-xs">—</span>
                    </template>
                    <template x-if="repo.check_upstream && repo.check_upstream.status === 'success'">
                      <a :href="repo.check_upstream.url" target="_blank" rel="noopener"
                         :title="'Last run: ' + repo.check_upstream.run_at"
                         class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium
                                bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400
                                hover:bg-green-200 dark:hover:bg-green-900/50 transition-colors">
                        <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                        pass
                      </a>
                    </template>
                    <template x-if="repo.check_upstream && repo.check_upstream.status === 'failure'">
                      <a :href="repo.check_upstream.url" target="_blank" rel="noopener"
                         :title="'Last run: ' + repo.check_upstream.run_at"
                         class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium
                                bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400
                                hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors">
                        <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                        </svg>
                        fail
                      </a>
                    </template>
                    <template x-if="repo.check_upstream && repo.check_upstream.status === 'approval_required'">
                      <a :href="repo.check_upstream.url" target="_blank" rel="noopener"
                         :title="'Workflow approval required · Last run: ' + repo.check_upstream.run_at"
                         class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium
                                bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400
                                hover:bg-yellow-200 dark:hover:bg-yellow-900/50 transition-colors">
                        <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        approval
                      </a>
                    </template>
                    <template x-if="repo.check_upstream && repo.check_upstream.status === 'pending'">
                      <a :href="repo.check_upstream.url" target="_blank" rel="noopener"
                         :title="'Last run: ' + repo.check_upstream.run_at"
                         class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium
                                bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400
                                hover:bg-yellow-200 dark:hover:bg-yellow-900/50 transition-colors">
                        <svg class="h-3 w-3 animate-spin" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                        </svg>
                        running
                      </a>
                    </template>
                    <template x-if="repo.check_upstream && repo.check_upstream.status === 'none'">
                      <a :href="repo.check_upstream.url" target="_blank" rel="noopener"
                         :title="'Last run: ' + repo.check_upstream.run_at"
                         class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium
                                bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400
                                hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        unknown
                      </a>
                    </template>
                  </td>

                  <td class="px-4 py-3">
                    <template x-if="repo.pending_update">
                      <span class="inline-flex items-center gap-1.5">
                        <a :href="repo.pending_update.pr_url" target="_blank" rel="noopener"
                           class="font-mono text-xs bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300
                                  px-2 py-1 rounded hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors"
                           x-text="'v' + repo.pending_update.new_version">
                        </a>
                        <!-- inline CI status icon for the update PR -->
                        <template x-if="repo.pending_update.ci_status === 'success'">
                          <svg class="h-3.5 w-3.5 text-green-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" title="PR CI passing">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                          </svg>
                        </template>
                        <template x-if="repo.pending_update.ci_status === 'failure'">
                          <svg class="h-3.5 w-3.5 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" title="PR CI failing">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                          </svg>
                        </template>
                        <template x-if="repo.pending_update.ci_status === 'approval_required'">
                          <span title="Workflow approval required">
                            <svg class="h-3.5 w-3.5 text-yellow-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                            </svg>
                          </span>
                        </template>
                        <template x-if="repo.pending_update.ci_status === 'pending'">
                          <svg class="h-3.5 w-3.5 text-yellow-500 flex-shrink-0 animate-spin" fill="none" viewBox="0 0 24 24" title="PR CI running">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                          </svg>
                        </template>
                      </span>
                    </template>
                    <template x-if="!repo.pending_update">
                      <span class="text-gray-300 dark:text-gray-600">—</span>
                    </template>
                  </td>

                </tr>
              </template>
            </template>

            <template x-if="!loading && !error && filteredRepos.length === 0 && repos.length > 0">
              <tr>
                <td colspan="6" class="px-4 py-10 text-center text-gray-400 dark:text-gray-500 text-sm">
                  No repositories match "<span x-text="search"></span>"
                </td>
              </tr>
            </template>

          </tbody>
        </table>
      </div>
    </div>

    <footer class="mt-6 text-center text-xs text-gray-400 dark:text-gray-600">
      Data collected 2× daily by
      <a href="https://github.com/gardenlinux/dashboard-containers/actions" target="_blank" rel="noopener"
         class="underline hover:no-underline">GitHub Actions</a>.
      Showing <span x-text="filteredRepos.length"></span>/<span x-text="repos.length"></span> repos.
    </footer>

  </main>

  <script>
    function dashboard() {
      return {
        loading: true,
        error: null,
        repos: [],
        search: '',
        darkMode: localStorage.getItem('darkMode') === 'true',
        generatedAt: null,

        async init() {
          await this.fetchData()
        },

        async fetchData() {
          this.loading = true
          this.error = null
          try {
            const resp = await fetch('./dashboard-data.json?_=' + Date.now())
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`)
            const data = await resp.json()
            this.repos = data.repos || []
            this.generatedAt = data.generated_at || null
          } catch (err) {
            this.error = `Failed to load data: ${err.message}`
          } finally {
            this.loading = false
          }
        },

        get filteredRepos() {
          const q = this.search.trim().toLowerCase()
          if (!q) return this.repos
          return this.repos.filter(r => r.name.toLowerCase().includes(q))
        },

        get pendingCount() {
          return this.repos.filter(r => r.pending_update !== null).length
        },

        get failCount() {
          return this.repos.filter(r => r.check_upstream?.status === 'failure').length
        },

        get formattedTimestamp() {
          if (!this.generatedAt) return 'unknown'
          return new Date(this.generatedAt).toLocaleString(undefined, {
            dateStyle: 'medium',
            timeStyle: 'short',
          })
        },

        relativeTime(isoString) {
          const diffMs = Date.now() - new Date(isoString).getTime()
          const diffDays = Math.floor(diffMs / 86400000)
          if (diffDays === 0) return 'today'
          if (diffDays === 1) return 'yesterday'
          if (diffDays < 30) return `${diffDays}d ago`
          const diffMonths = Math.floor(diffDays / 30)
          if (diffMonths < 12) return `${diffMonths}mo ago`
          return `${Math.floor(diffMonths / 12)}y ago`
        },
      }
    }
  </script>

</body>
</html>
